name: Backend quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Includes strict source/test and supported-tool lint, docs checks, and
      # canonical Node discovery (including migration upgrade and Worker smoke).
      - run: npm run verify
